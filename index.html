<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Taakhi Services</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<img src="logo.png" class="logo">
<div class="phones">(+961) 08375575 | (+961) 08375675 | (+961) 08375775</div>
</header>
<div class="container">
<div class="left">
<h2>Available Services</h2>
<input id="search" placeholder="Search service">
<select id="dept"></select>
<table id="results"></table>
</div>
<div class="right">
<h2>Selected Services</h2>
<table id="selected"></table>
<h3>Total: <span id="total">0</span></h3>
</div>
</div>
<script src="app.js"></script>
  <script>
let total=0;
fetch('taakhi_prices.json')
.then(r=>r.json())
.then(data=>{
window.allData=data;

document.getElementById('search').addEventListener('input',function(){
let q=this.value.toLowerCase();
let rows=data.filter(x=>x.name.toLowerCase().includes(q)).slice(0,100);
let html='';
rows.forEach((item,i)=>{
html+=`<tr>
<td><input type="checkbox" onchange="updateTotal(${item.price},this)"></td>
<td>${item.name}</td>
<td>${item.code}</td>
<td>${item.price.toFixed(2)}</td>
</tr>`;
});
document.getElementById('results').innerHTML=html;
});
});
function updateTotal(price,cb){
total += cb.checked ? price : -price;
document.getElementById('total').innerText=total.toFixed(2);
}
</script>
</body>
</html>
